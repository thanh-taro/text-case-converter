# CI (MOD-Build, ADR-0009): codegen freshness, types, lint, tests, build, budgets, licenses, e2e.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check:size
      - run: pnpm check:licenses
      # Full e2e on all three engines (NFR-06): smoke, host integration, offline, a11y (axe).
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:e2e
